[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ham"
version = "1.0.0"
description = "HAM: Hash Accelerated Matcher for Perturb-seq sgRNA quantification"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Yunzliu", email = "yunzliu@example.com"},
]
keywords = ["perturb-seq", "sgrna", "single-cell", "bioinformatics", "guide-quantification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
]

[project.scripts]
ham = "ham.cli:main"

[project.urls]
Homepage = "https://github.com/xxx/ham"
Repository = "https://github.com/xxx/ham"
Issues = "https://github.com/xxx/ham/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
